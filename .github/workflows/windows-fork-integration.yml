name: Windows Fork Integration Build

# Fork-only unsigned NSIS build for explicit testing. Never submit upstream.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-integration-client
  cancel-in-progress: false

env:
  CANONICAL_WINDOWS_BRANCH: windows-integration
  # Last product-valid client before the single cumulative branch existed.
  WINDOWS_INTEGRATION_BOOTSTRAP_SHA: 1a3084e4d3a7a93492ac9a82ebdfffb40c2def39

jobs:
  validate-cumulative-lineage:
    name: Validate cumulative Windows client lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve previous successful Windows build
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_sha=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/windows-fork-integration.yml/runs?branch=${CANONICAL_WINDOWS_BRANCH}&status=success&per_page=20" \
              --jq '.workflow_runs[].head_sha' \
              | head -n 1
          )
          if [[ -z "$previous_sha" ]]; then
            previous_sha="$WINDOWS_INTEGRATION_BOOTSTRAP_SHA"
            echo "Using product-valid bootstrap baseline $previous_sha"
          fi
          git fetch --no-tags origin "$previous_sha"
          echo "sha=$previous_sha" >> "$GITHUB_OUTPUT"

      - name: Verify cumulative lineage and retained client surfaces
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          set -euo pipefail
          scripts/verify-windows-client-lineage.sh \
            "$PREVIOUS_SHA" "$GITHUB_SHA" "$GITHUB_REF_NAME"
          scripts/check-windows-client-contract.sh "$GITHUB_SHA"

  build:
    name: Build unsigned Windows integration installer
    needs: validate-cumulative-lineage
    if: github.repository == 'Jari81/buzz'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Derive test-only version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$BASE_VERSION' is not semver"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-fork.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building unsigned test version $VERSION from $GITHUB_SHA"

      - name: Patch test-only version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri
          cargo update --workspace

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
          shared-key: windows-fork-integration

      - name: Generate non-updating bundle config
        shell: bash
        run: node -e "require('fs').writeFileSync('desktop/src-tauri/tauri.canary.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build unsigned Windows NSIS installer
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.canary.conf.json

      - name: Locate installer
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          EXE=$(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR/nsis"
            exit 1
          fi
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-windows-integration-${{ github.sha }}
          path: ${{ steps.artifact.outputs.exe }}
          if-no-files-found: error
          retention-days: 7
